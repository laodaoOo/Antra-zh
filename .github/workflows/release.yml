          create-dmg \
            --volname "Antra" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$(basename $APP)" 175 190 \
            --hide-extension "$(basename $APP)" \
            --app-drop-link 425 190 \
            "Antra-macOS-Intel.dmg" \
            "$APP"

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antra-macOS-Intel
          path: Antra-macOS-Intel.dmg

  release:
    name: Upload to Release
    needs: [build-windows, build-linux, build-macos, build-macos-intel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event.inputs.tag }}" != "" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body: |
            ## Antra 中文版

            > 本仓库是 [Antra](https://github.com/anandprtp/Antra) 的**简体中文汉化版**：界面、桌面端提示、音频分析器结论与文档已全部汉化，功能与原版一致。

            ## 本次更新

            - **动态 Logo** —— 欢迎页新的电路板「A」Logo，环绕各服务平台图标（Spotify、Apple Music、Amazon、Tidal、Deezer 等）
            - **更简洁的首次设置** —— 首次运行只显示文件夹选择，其余设置都在专属面板里
            - **文件夹结构面板** —— 新的 📁 按钮，可设置音乐库模式、文件夹结构与文件名格式
            - **设置页精简** —— ⚙️ 设置只保留 API 密钥、失败重试与下载来源
            - **新增来源适配器** —— Deezer、Tidal、Qobuz 镜像适配器；YouTube 通过 yt-dlp
            - **核心引擎改进** —— 解析器、归档、标签、转码全面优化
            - **社区** —— 加入 [Telegram](https://t.me/antraaverse) · 在 [Patreon](https://patreon.com/AntraVerse) 上支持原作者

            ## 下载

            [![Windows](https://img.shields.io/github/downloads/${{ github.repository }}/${{ steps.tag.outputs.tag }}/Antra.exe?display_name=true&logo=windows&label=Windows&style=for-the-badge&color=0078D6)](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/Antra.exe)
            [![macOS Apple Silicon](https://img.shields.io/github/downloads/${{ github.repository }}/${{ steps.tag.outputs.tag }}/Antra-macOS.dmg?display_name=true&logo=apple&label=macOS+Apple+Silicon&style=for-the-badge&color=111111)](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/Antra-macOS.dmg)
            [![macOS Intel](https://img.shields.io/github/downloads/${{ github.repository }}/${{ steps.tag.outputs.tag }}/Antra-macOS-Intel.dmg?display_name=true&logo=apple&label=macOS+Intel&style=for-the-badge&color=555555)](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/Antra-macOS-Intel.dmg)
            [![Linux](https://img.shields.io/github/downloads/${{ github.repository }}/${{ steps.tag.outputs.tag }}/Antra-Linux.AppImage?display_name=true&logo=linux&label=Linux&style=for-the-badge&color=FCC624&logoColor=black)](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/Antra-Linux.AppImage)

            ## 文件说明

            - `Antra.exe`：Windows
            - `Antra-Linux.AppImage`：Linux
            - `Antra-macOS.dmg`：macOS（Apple Silicon）
            - `Antra-macOS-Intel.dmg`：macOS（Intel）

            <details>
            <summary>Linux 安装说明</summary>

            下载 `Antra-Linux.AppImage`，然后安装对应发行版的 WebKit 依赖：

            **Ubuntu / Debian：**
            ```
            sudo apt install libwebkit2gtk-4.1-0
            ```
            **Arch Linux：**
            ```
            sudo pacman -S webkit2gtk-4.1
            ```
            **Fedora：**
            ```
            sudo dnf install webkit2gtk4.1
            ```

            然后赋予执行权限并运行：
            ```bash
            chmod +x Antra-Linux.AppImage
            ./Antra-Linux.AppImage
            ```

            如果 Ubuntu 不允许你从 `~/Downloads` 直接运行，先把它移出来：
            ```bash
            mv ~/Downloads/Antra-Linux.AppImage ~/
            cd ~
            chmod +x Antra-Linux.AppImage
            ./Antra-Linux.AppImage
            ```

            </details>

            <details>
            <summary>macOS 安装说明</summary>

            下载与你 Mac 对应的 DMG（Apple Silicon 用 `Antra-macOS.dmg`，Intel 用 `Antra-macOS-Intel.dmg`），打开后把 `Antra` 拖进 `Applications` 文件夹。

            首次启动时 macOS 可能提示「Apple 无法验证」，按下面步骤打开：

            1. 打开 `Applications`
            2. 右键点击 `Antra`
            3. 点「打开」
            4. 在警告弹窗里再点一次「打开」

            macOS 小提示：

            - 如果仍打不开，去「系统设置 → 隐私与安全性」，若有「仍要打开」按钮就点它。
            - 可能需要先把 App 从 DMG 拖到 `Applications` 再打开。
            - 此构建尚未公证（notarized），首次运行出现安全提示属正常现象。

            </details>
          files: |
            dist/Antra-Windows/Antra.exe
            dist/Antra-Linux/Antra-Linux.AppImage
            dist/Antra-macOS/Antra-macOS.dmg
            dist/Antra-macOS-Intel/Antra-macOS-Intel.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
