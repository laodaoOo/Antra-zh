name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload artifacts to (e.g. v1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      WAILS_VERSION: v2.12.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: antra-wails/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python Dependencies
        run: pip install -r requirements-desktop.txt

      - name: Install UPX
        run: |
          choco install upx -y
          upx --version

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build Python Backend
        working-directory: antra-wails
        run: |
          New-Item -ItemType Directory -Force -Path runtime/backend | Out-Null
          pyinstaller backend_runtime.spec --distpath runtime/backend --noconfirm

      - name: Smoke test backend
        working-directory: antra-wails
        shell: pwsh
        run: |
          # v1.1.8 shipped three broken releases because the build was judged by
          # "it compiled" instead of "it runs". This runs the real download entry
          # point; ModuleNotFoundError here fails the BUILD, never the user.
          $out = & ./runtime/backend/AntraBackend.exe "https://open.spotify.com/track/0000000000000000000000" --config nul 2>&1 | Out-String
          if ($out -match 'ModuleNotFoundError|Failed to execute script') {
            Write-Host $out
            throw "Backend is missing modules - refusing to publish"
          }
          Write-Host "backend smoke test OK"

      - name: Smoke test endpoint manifest cache resolution
        working-directory: antra-wails
        shell: pwsh
        run: |
          # A second broken release, distinct from the first: platformdirs'
          # user_data_dir() can raise inside a frozen build (it lazily imports
          # an OS-specific submodule the first time it is CALLED, and that
          # submodule can be silently dropped by PyInstaller the same way
          # antra.utils.organizer was). The old fallback then resolved inside
          # _MEIPASS, an ephemeral temp dir wiped on exit, so the endpoint-
          # manifest cache Go writes was never visible to Python -- "No Tidal
          # mirror URL available" on every download, on every machine, always.
          # This drives the real ANTRA_ENDPOINT_MANIFEST_DISABLED=1 code path
          # (what Go sets whenever it resolved the manifest itself) against a
          # cache file seeded exactly like Go would write it, and fails the
          # build if the resolved URL is empty or lands inside a temp dir.
          # Do NOT hardcode the cache location: ask the binary where it actually
          # looks, then seed exactly there. Hardcoding is what made the first
          # version of this test fail on Linux -- platformdirs uses appauthor
          # only on Windows, so the path differs per platform and an assumption
          # here tests the test, not the product.
          $env:ANTRA_ENDPOINT_MANIFEST_DISABLED = "1"
          $probe = & ./runtime/backend/AntraBackend.exe --debug-manifest 2>&1 | Out-String
          $cachePath = ($probe | ConvertFrom-Json).cache_path
          Write-Host "backend reads its cache from: $cachePath"
          New-Item -ItemType Directory -Force -Path (Split-Path $cachePath) | Out-Null
          $cache = @{
            hifi = @(); amazon = @(); apple = @()
            mirrors = @{ tidal = "https://tidal.example.test"; qobuz = "https://qobuz.example.test" }
            api_key = "ak_test"
          } | ConvertTo-Json
          Set-Content -Path $cachePath -Value $cache -Encoding utf8

          $out = & ./runtime/backend/AntraBackend.exe --debug-manifest 2>&1 | Out-String
          Remove-Item Env:ANTRA_ENDPOINT_MANIFEST_DISABLED
          Write-Host $out
          $info = $out | ConvertFrom-Json
          if ($info.resolved_tidal -ne "https://tidal.example.test") {
            throw "endpoint manifest cache not resolved from the persistent path - refusing to publish"
          }
          if ($info.data_dir -like "*_MEI*" -or $info.data_dir -like "*Temp*") {
            throw "app-data dir resolved inside a temp directory - refusing to publish"
          }
          Write-Host "endpoint manifest cache smoke test OK"

      - name: Build Wails App
        working-directory: antra-wails
        run: wails build -clean

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antra-Windows
          path: antra-wails/build/bin/Antra.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    env:
      WAILS_VERSION: v2.12.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: antra-wails/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python Dependencies
        run: pip install -r requirements-desktop.txt

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config \
            upx \
            libfuse2 \
            file

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build Python Backend
        working-directory: antra-wails
        run: |
          mkdir -p runtime/backend
          pyinstaller backend_runtime.spec --distpath runtime/backend --noconfirm

      - name: Smoke test backend
        working-directory: antra-wails
        run: |
          out=$(./runtime/backend/AntraBackend "https://open.spotify.com/track/0000000000000000000000" --config /dev/null 2>&1 || true)
          if echo "$out" | grep -qE 'ModuleNotFoundError|Failed to execute script'; then
            echo "$out"; echo "Backend is missing modules - refusing to publish"; exit 1
          fi
          echo "backend smoke test OK"

      - name: Smoke test endpoint manifest cache resolution
        working-directory: antra-wails
        run: |
          # See the Windows job for the full explanation: platformdirs can raise
          # inside a frozen build, and the old fallback pointed at an ephemeral
          # temp dir. This seeds a cache file the way Go writes it and drives
          # the real ANTRA_ENDPOINT_MANIFEST_DISABLED=1 path against it.
          # Ask the binary where it looks rather than hardcoding: platformdirs
          # uses appauthor only on Windows, so the path differs per platform.
          # Hardcoding it is what made the first version of this test fail here.
          probe=$(ANTRA_ENDPOINT_MANIFEST_DISABLED=1 ./runtime/backend/AntraBackend --debug-manifest 2>&1)
          cache_path=$(echo "$probe" | python3 -c "import json,sys; print(json.load(sys.stdin)['cache_path'])")
          echo "backend reads its cache from: $cache_path"
          mkdir -p "$(dirname "$cache_path")"
          printf '%s' '{"hifi": [], "amazon": [], "apple": [], "mirrors": {"tidal": "https://tidal.example.test", "qobuz": "https://qobuz.example.test"}, "api_key": "ak_test"}' > "$cache_path"
          out=$(ANTRA_ENDPOINT_MANIFEST_DISABLED=1 ./runtime/backend/AntraBackend --debug-manifest 2>&1)
          echo "$out"
          resolved=$(echo "$out" | python3 -c "import json,sys; print(json.load(sys.stdin).get('resolved_tidal',''))")
          data_dir=$(echo "$out" | python3 -c "import json,sys; print(json.load(sys.stdin).get('data_dir',''))")
          if [ "$resolved" != "https://tidal.example.test" ]; then
            echo "endpoint manifest cache not resolved from the persistent path - refusing to publish"; exit 1
          fi
          case "$data_dir" in *_MEI*|/tmp/*) echo "app-data dir resolved inside a temp directory - refusing to publish"; exit 1 ;; esac
          echo "endpoint manifest cache smoke test OK"

      - name: Build Wails App
        working-directory: antra-wails
        run: wails build -clean -tags webkit2_41

      - name: Package as AppImage
        run: |
          # Download appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

          # Find the built binary
          BIN=$(find antra-wails/build/bin -maxdepth 1 -type f -executable | head -1)

          # Create AppDir structure
          mkdir -p AppDir/usr/bin

          cp "$BIN" AppDir/usr/bin/Antra

          # Desktop entry
          printf '[Desktop Entry]\nName=Antra\nExec=Antra\nIcon=Antra\nType=Application\nCategories=AudioVideo;Audio;\nComment=Lossless music library downloader\n' > AppDir/Antra.desktop
          # Some launchers / AppImage integrators read the copy under
          # usr/share/applications rather than the AppDir root.
          mkdir -p AppDir/usr/share/applications
          cp AppDir/Antra.desktop AppDir/usr/share/applications/Antra.desktop

          # Icon. This used to copy frontend/src/assets/images/logo-universal.png,
          # which is the stock WAILS TEMPLATE LOGO — so every AppImage ever shipped
          # carried the Wails icon instead of Antra's. Use the real app icon, and
          # install it at all three paths desktop environments actually look at:
          # AppDir/<name>.png, .DirIcon (thumbnailers/file managers), and the
          # hicolor theme path (menus after integration).
          cp antra-wails/build/linux/appicon.png AppDir/Antra.png
          cp AppDir/Antra.png AppDir/.DirIcon
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
          cp AppDir/Antra.png AppDir/usr/share/icons/hicolor/512x512/apps/Antra.png

          # AppRun — lean launcher, relies on system webkit2gtk-4.1
          printf '#!/bin/bash\nexec "$(dirname "$(readlink -f "${0}")")/usr/bin/Antra" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

          # Build the AppImage
          ARCH=x86_64 /tmp/appimagetool AppDir Antra-Linux.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antra-Linux
          path: Antra-Linux.AppImage

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    env:
      WAILS_VERSION: v2.12.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: antra-wails/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python Dependencies
        run: pip install -r requirements-desktop.txt

      - name: Install macOS Dependencies
        run: brew install create-dmg upx || true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build Python Backend
        working-directory: antra-wails
        run: |
