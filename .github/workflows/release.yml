          # Hardcoding it is what made the first version of this test fail here.
          probe=$(ANTRA_ENDPOINT_MANIFEST_DISABLED=1 ./runtime/backend/AntraBackend --debug-manifest 2>&1)
          cache_path=$(echo "$probe" | python3 -c "import json,sys; print(json.load(sys.stdin)['cache_path'])")
          echo "backend reads its cache from: $cache_path"
          mkdir -p "$(dirname "$cache_path")"
          printf '%s' '{"hifi": [], "amazon": [], "apple": [], "mirrors": {"tidal": "https://tidal.example.test", "qobuz": "https://qobuz.example.test"}, "api_key": "ak_test"}' > "$cache_path"
          out=$(ANTRA_ENDPOINT_MANIFEST_DISABLED=1 ./runtime/backend/AntraBackend --debug-manifest 2>&1)
